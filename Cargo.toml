[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/shotlet-types",
  "crates/shotlet-platform",
  "crates/shotlet-image",
  "crates/shotlet-capture",
  "crates/shotlet-store",
  "crates/shotlet-media",
  "crates/shotlet-core",
]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
arboard = "3.7.0"
base64 = "0.23.1"
chrono = "0.4.45"
xcap = { version = "0.9.10", features = ["image"] }
gif = "0.14.2"
dirs = "7.0.0"
shotlet-types = { path = "crates/shotlet-types" }
shotlet-platform = { path = "crates/shotlet-platform" }
shotlet-image = { path = "crates/shotlet-image" }
shotlet-capture = { path = "crates/shotlet-capture" }
shotlet-store = { path = "crates/shotlet-store" }
shotlet-media = { path = "crates/shotlet-media" }
shotlet-core = { path = "crates/shotlet-core" }

# Dev builds spend their time encoding PNG and grabbing screens. Optimize those
# crates even in debug so capture stays responsive.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.xcap]
opt-level = 3

[profile.dev.package.shotlet-platform]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
