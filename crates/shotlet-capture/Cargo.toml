[package]
name = "shotlet-capture"
version.workspace = true
edition.workspace = true
publish = false
description = "Monitor grab, window list, and crop. No history and no overlay windows."

[dependencies]
image.workspace = true
shotlet-platform.workspace = true
shotlet-types.workspace = true
xcap.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
