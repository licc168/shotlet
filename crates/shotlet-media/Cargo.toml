[package]
name = "shotlet-media"
version.workspace = true
edition.workspace = true
publish = false
description = "OCR, recording, and scroll stitch. No history store and no overlay windows."

[dependencies]
dirs.workspace = true
gif.workspace = true
image.workspace = true
shotlet-capture.workspace = true
shotlet-image.workspace = true
shotlet-platform.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }
