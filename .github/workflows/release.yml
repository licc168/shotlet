name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Which installer to build
        type: choice
        options:
          - all
          - macos-aarch64
          - macos-x64
          - windows-x64
        default: all

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os
          items = [
              {"name": "macos-aarch64", "platform": "macos-latest", "args": "--target aarch64-apple-darwin", "rust_targets": "aarch64-apple-darwin"},
              {"name": "macos-x64", "platform": "macos-latest", "args": "--target x86_64-apple-darwin", "rust_targets": "x86_64-apple-darwin"},
              {"name": "windows-x64", "platform": "windows-latest", "args": "", "rust_targets": "x86_64-pc-windows-msvc"},
          ]
          target = os.environ.get("TARGET") or "all"
          if os.environ.get("EVENT_NAME") == "workflow_dispatch" and target != "all":
              items = [item for item in items if item["name"] == target]
          if not items:
              raise SystemExit(f"unknown target: {target}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix<<EOF\n")
              handle.write(json.dumps(items))
              handle.write("\nEOF\n")
          PY

  publish:
    needs: setup
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Shotlet v__VERSION__
          releaseBody: |
            Windows 安装包为 NSIS 和 MSI。macOS 包含 Apple Silicon 与 Intel 的 DMG。
            这些安装包没有代码签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
